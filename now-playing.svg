    <ellipse cx="144" cy="111" rx="5" ry="10" transform="rotate(72 144 130)"/>
    <ellipse cx="144" cy="111" rx="5" ry="10" transform="rotate(144 144 130)"/>
    <ellipse cx="144" cy="111" rx="5" ry="10" transform="rotate(216 144 130)"/>
    <ellipse cx="144" cy="111" rx="5" ry="10" transform="rotate(288 144 130)"/>
  </g>

  <text x="310" y="54" fill="#8E5E79" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="3">NOW PLAYING  /  LEARNING LOG</text>
  <text x="310" y="102" fill="#3C2B46" font-family="Noto Sans CJK SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="30" font-weight="700">今天，也在认真练习。</text>
  <path d="M310 119H1142" stroke="#DAB6C6" stroke-width="2"/>

  <g font-family="Noto Sans CJK SC, Microsoft YaHei, Segoe UI, sans-serif" font-size="19" fill="#49384F">
    <text x="311" y="155"><tspan fill="#A16784" font-family="Consolas, Menlo, monospace">01  </tspan>Agent 的工具调用</text>
    <text x="311" y="189"><tspan fill="#A16784" font-family="Consolas, Menlo, monospace">02  </tspan>给 Agent 留一份记忆</text>
    <text x="311" y="223"><tspan fill="#A16784" font-family="Consolas, Menlo, monospace">03  </tspan>把链表的指针画出来</text>
  </g>
  <g fill="#BE8BA4">
