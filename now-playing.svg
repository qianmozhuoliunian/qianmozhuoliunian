<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">正在播放：我的学习曲目</title>
  <desc id="desc">唱片造型的学习卡片，列出 Tool Calling、Agent 记忆和链表动画</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4F7"/>
      <stop offset="1" stop-color="#F7DFE8"/>
    </linearGradient>
    <linearGradient id="vinyl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#32263E"/>
      <stop offset="1" stop-color="#6F4D70"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" rx="24" fill="url(#paper)"/>
  <rect x="1" y="1" width="1198" height="258" rx="23" fill="none" stroke="#EBC5D3" stroke-width="2"/>
  <rect x="20" y="20" width="248" height="220" rx="16" fill="#EACAD9" opacity=".45"/>
  <circle cx="144" cy="130" r="99" fill="url(#vinyl)"/>
  <circle cx="144" cy="130" r="78" fill="none" stroke="#F3C8D9" stroke-opacity=".22" stroke-width="2"/>
  <circle cx="144" cy="130" r="63" fill="none" stroke="#F3C8D9" stroke-opacity=".22" stroke-width="2"/>
  <circle cx="144" cy="130" r="48" fill="none" stroke="#F3C8D9" stroke-opacity=".22" stroke-width="2"/>
  <circle cx="144" cy="130" r="31" fill="#F3C5D6"/>
  <circle cx="144" cy="130" r="7" fill="#4D3655"/>
  <g fill="#FFF0F4" opacity=".9">
