  <text x="1018" y="189" fill="#9C6D86" font-family="Consolas, Menlo, monospace" font-size="12" letter-spacing="1">EXPLORING</text>
  <text x="1018" y="223" fill="#9C6D86" font-family="Consolas, Menlo, monospace" font-size="12" letter-spacing="1">SKETCHING</text>
